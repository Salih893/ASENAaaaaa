name: ASENA APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Türkçe modeli indir
        run: |
          mkdir -p app/src/main/assets/model
          curl -L --fail --retry 3 \
            https://alphacephei.com/vosk/models/vosk-model-small-tr-0.3.zip \
            -o /tmp/vosk-model.zip
          unzip -q /tmp/vosk-model.zip -d /tmp/vosk-model
          cp -R /tmp/vosk-model/vosk-model-small-tr-0.3/. app/src/main/assets/model/
          cat /proc/sys/kernel/random/uuid > app/src/main/assets/model/uuid

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK oluştur
        run: gradle --no-daemon assembleDebug

      - name: APK dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: ASENA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
